name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew clean build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MerchantOrders-NeoForge-1.21.1
          path: build/libs/*.jar
